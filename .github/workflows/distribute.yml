name: Distribute to Firebase App Distribution

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  distribute-android:
    name: Build & distribute Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Build Android (EAS)
        id: build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build --platform android --profile production --non-interactive --json > eas-build-result.json
          ARTIFACT_URL=$(node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('eas-build-result.json', 'utf8'));
            const artifacts = r.artifacts || r.artifact_urls || [];
            console.log(artifacts[0]?.url || '');
          ")
          echo "artifact_url=$ARTIFACT_URL" >> "$GITHUB_OUTPUT"
          echo "EAS build artifact URL: $ARTIFACT_URL"

      - name: Download Android artifact
        run: |
          npx eas-cli artifact:download ${{ steps.build.outputs.artifact_url }} --output money-tracker.aab
          ls -la money-tracker.aab

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute money-tracker.aab \
            --app ${{ secrets.FIREBASE_APP_ID_ANDROID }} \
            --groups testers \
            --release-notes "$(git log -1 --pretty=%B)"

